[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "job_search_tool"
version = "0.1.0"
description = "Sweep public ATS job boards for health-aligned analytics roles, extract pay, and shortlist."
requires-python = ">=3.9"
dependencies = ["requests", "pandas", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
